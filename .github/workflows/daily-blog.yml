name: Daily blog post
on:
  schedule:
    - cron: '0 13 * * *'   # 13:00 UTC = 6am Pacific / 9am Eastern
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-blog
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # sitemap.ts reads git history for per-page lastModified
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Write today's post
        id: write
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          node scripts/daily-blog.mjs
          if [ -n "$(git status --porcelain)" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Commit
        if: steps.write.outputs.changed == 'true'
        run: |
          git config user.name "webcrew-blog-bot"
          git config user.email "hello@webcrew.app"
          git add src/content/blog public/blog
          git commit -m "blog: daily post $(date -u +%F)"
          git push
      # Pushes made with GITHUB_TOKEN do not trigger deploy.yml, so deploy here.
      - name: Install deps
        if: steps.write.outputs.changed == 'true'
        run: npm install --legacy-peer-deps
      - name: Build
        if: steps.write.outputs.changed == 'true'
        run: npm run build
      - name: Deploy
        if: steps.write.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=webcrew --commit-dirty=true
